[package]
name = "guoyun"
version = "0.1.15"
description = "国运：中国古代 · 角色扮演大战略游戏"
authors = ["国运开发组"]
edition = "2021"

[lib]
name = "guoyun_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.8", features = [] }
tauri-plugin-updater = "2.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
